# Builds the installable app on Windows, macOS and Linux.
#
# A pushed vX.Y.Z tag (scripts/release.py makes one) builds all three and opens a
# DRAFT release with them attached. The draft's notes are what the app's update
# banner shows, so they are rewritten for readers before the draft is published;
# nothing reaches users until then. See docs/releasing.md.
#
# Run by hand (Actions > Release > Run workflow), choose all platforms, Mac, or Windows.
# Both paths retain source/frozen acceptance without releasing anything.
#
# Build names (must match updates.ASSET_SUFFIX):
#   Paperfact-X.Y.Z-windows-x64-setup.exe
#   Paperfact-X.Y.Z-macos-arm64.dmg
#   Paperfact-X.Y.Z-linux-x86_64.AppImage
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Candidate build platforms (tags always build all)
        type: choice
        options: [all, macos, windows]
        default: all

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Tags always cover all platforms; a manual Mac candidate uses the same steps.
        # Linux retains the oldest supported runner for AppImage compatibility.
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && inputs.platform == 'macos'
            && '[{"os":"macos-latest","name":"macos"}]'
            || github.event_name == 'workflow_dispatch' && inputs.platform == 'windows'
            && '[{"os":"windows-latest","name":"windows"}]'
            || '[{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"},{"os":"ubuntu-22.04","name":"linux"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The reports print Chinese; a Windows runner's console is cp1252.
      PYTHONIOENCODING: utf-8
      # Linux runs the windows on a virtual X display: Qt WebEngine crashes with
      # no display at all (the offscreen platform) on a runner without a GPU.
      QT_QPA_PLATFORM: ${{ matrix.name == 'linux' && 'xcb' || 'offscreen' }}
      DISPLAY_WRAPPER: ${{ matrix.name == 'linux' && 'xvfb-run -a -s "-screen 0 1920x1080x24"' || '' }}
      # The Linux runner has no GPU, and Chromium's GPU process crashes the app when
      # it tries to start one there; a desktop with a graphics driver needs no flag.
      QTWEBENGINE_CHROMIUM_FLAGS: ${{ matrix.name == 'linux' && '--disable-gpu' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2 libfontconfig1 libdbus-1-3 file xvfb \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Inno Setup on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Require Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Environment
        run: uv sync --extra app --extra dev --extra build

      - name: Fonts and web assets
        shell: bash
        run: |
          uv run python -m paper_daily fonts
          uv run python -m paper_daily web-assets

      - name: Prepare pinned upgrade baseline
        timeout-minutes: 3
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 3abdf434555583ca4a6827892d54b487e9e40671
          mkdir -p build
          mkdir build/upgrade-baseline-0.4.3
          git -c core.autocrlf=false archive --format=tar --output=build/upgrade-baseline-0.4.3.tar 3abdf434555583ca4a6827892d54b487e9e40671 src scripts/demo_workspace.py
          tar -xf build/upgrade-baseline-0.4.3.tar -C build/upgrade-baseline-0.4.3

      # Common release risks run once; every OS retains critical native journeys.
      - name: Curated source acceptance
        timeout-minutes: 10
        run: ${{ env.DISPLAY_WRAPPER }} uv run python scripts/check.py --profile ${{ matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/v') && 'release' || 'critical' }}

      # The Windows tag release selection already includes this representative.
      - name: First-sync research preservation
        if: ${{ !(matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/v')) }}
        timeout-minutes: 3
        run: ${{ env.DISPLAY_WRAPPER }} uv run python scripts/check.py --profile focused --python tests/test_enrollment_integration_history.py::test_real_import_history_can_prepare_without_reactivating_receipts

      # Small OS-specific socket/file-lifetime representatives, not historical stress.
      - name: Sync authority lifetime acceptance
        timeout-minutes: 3
        run: >-
          ${{ env.DISPLAY_WRAPPER }} uv run python scripts/check.py --profile focused --python
          tests/test_sync_http.py::test_listener_exclusion_failed_bind_and_repeated_close_preserve_authority
          tests/test_sync_http.py::test_listener_claim_survives_close_until_active_requests_drain
          tests/test_sync_http.py::test_listener_claim_is_released_by_process_exit_without_deleting_lock
          tests/test_sync_http.py::test_live_listener_refuses_replaced_or_missing_database_without_recreating_it
          tests/test_sync_http.py::test_listener_close_interrupts_incomplete_headers_without_waiting_for_client
          tests/test_sync_admin.py::test_second_serve_is_actionable_and_preserves_existing_authority
          tests/test_sync_admin.py::test_same_file_revocation_rollback_is_refused_after_restart
          tests/test_authority_control.py
          tests/test_authority_control_history.py
          tests/test_control_checkpoint.py
          tests/test_control_recovery.py
          tests/test_offline_verification_ui.py::test_completed_worker_cannot_deliver_stale_offline_success
          tests/test_storage.py::test_prune_preserves_offline_and_managed_originals_even_after_planning

      # One shared static artifact; this never deploys or changes a running host.
      - name: Build verified mobile web artifact
        if: matrix.name == 'windows'
        timeout-minutes: 2
        shell: bash
        run: |
          node --test --test-concurrency=1 tests/test_mobile_artifact.mjs
          node scripts/build_mobile.mjs --output build/mobile-web
          node scripts/build_mobile.mjs --verify build/mobile-web

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: mobile-web-${{ github.sha }}
          path: build/mobile-web/
          if-no-files-found: error

      - name: Screenshots
        env:
          # Rendering acceptance needs a real Mac surface, not an offscreen placeholder.
          QT_QPA_PLATFORM: ${{ matrix.name == 'macos' && 'cocoa' || matrix.name == 'linux' && 'xcb' || 'offscreen' }}
          # Scoped to synthetic screenshots; installed apps retain normal graphics settings.
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: ${{ env.DISPLAY_WRAPPER }} uv run python scripts/screenshots.py shots --demo

      - name: Build
        run: ${{ env.DISPLAY_WRAPPER }} uv run python scripts/build_app.py

      - name: Verify frozen research workflow
        shell: bash
        run: |
          built=dist/Paperfact
          if [ "${{ runner.os }}" = "macOS" ]; then built=dist/Paperfact.app; fi
          extra=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            installers=(dist/Paperfact-*-windows-x64-setup.exe)
            if [ "${#installers[@]}" -ne 1 ] || [ ! -f "${installers[0]}" ]; then
              echo "Expected exactly one Windows setup artifact"
              exit 1
            fi
            extra=(--installer "${installers[0]}")
          fi
          ${{ env.DISPLAY_WRAPPER }} uv run python scripts/verify_built_app.py "$built" build/frozen-acceptance "${extra[@]}" --legacy-source build/upgrade-baseline-0.4.3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.name }}
          # Fixed synthetic recipient only; never upload an entire workspace.
          path: |
            build/frozen-acceptance/*.log
            build/frozen-acceptance/recipient/workspace/app-fault.log
            build/frozen-acceptance/sync-protocol/init.log
            build/frozen-acceptance/sync-protocol/issue.log
            build/frozen-acceptance/sync-protocol/first-listener.log
            build/frozen-acceptance/sync-protocol/second-listener.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-${{ matrix.name }}
          path: |
            build/build-info.json
            build/frozen-acceptance/report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: |
            shots/*.png
            shots/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: research-fixture-${{ matrix.name }}
          path: build/frozen-acceptance/original.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: |
            dist/Paperfact-*-windows-x64-setup.exe
            dist/Paperfact-*-macos-arm64.dmg
            dist/Paperfact-*-linux-x86_64.AppImage
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v -x "$TAG" | head -n 1)
          git archive --format=zip --prefix=Paperfact/ --output="dist/Paperfact-${TAG#v}-source.zip" "$TAG"
          {
            echo "<!-- The first lines below are what the app's update banner shows."
            echo "     Rewrite them for readers, then publish. -->"
            echo
            echo "## 這一版"
            echo
            echo "- （寫給使用者看的重點）"
            echo
            echo "## Changes"
            echo
            git log --format='- %s' ${previous:+$previous..}"$TAG"
          } > notes.md
          gh release create "$TAG" dist/* --draft --title "Paperfact ${TAG#v}" --notes-file notes.md
